name: shooting
on:
  push:
    paths: ['plugins/shooting/**', '.claude-plugin/marketplace.json', '.github/workflows/shooting.yml']
  pull_request:
    paths: ['plugins/shooting/**', '.claude-plugin/marketplace.json', '.github/workflows/shooting.yml']
defaults:
  run:
    working-directory: plugins/shooting
jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python3 scripts/verify.py
      - run: pip install pillow numpy scipy matplotlib
      - run: python3 scripts/smoke.py
      - run: ./scripts/build.sh
